<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="60%" stop-color="#BE123C" />
      <stop offset="100%" stop-color="#881337" />
    </radialGradient>
    
    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="30%" stop-color="#FCD34D" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Inner Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Circular Plate -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4" filter="url(#glow)" />
  
  <!-- Subtle Inner Ring -->
  <circle cx="64" cy="64" r="51" fill="none" stroke="#FDE68A" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.7" />

  <!-- 16-Ray Radiant Shams (Sun) Motif -->
  <g transform="translate(64,64)">
    <!-- 8 Primary Rays -->
    <g fill="url(#goldGrad)">
      <polygon points="0,-46 5,-33 -5,-33" />
      <polygon points="0,46 5,33 -5,33" />
      <polygon points="-46,0 -33,-5 -33,5" />
      <polygon points="46,0 33,-5 33,5" />
      
      <polygon points="-32,-32 -20,-27 -27,-20" />
      <polygon points="32,-32 20,-27 27,-20" />
      <polygon points="-32,32 -20,27 -27,20" />
      <polygon points="32,32 20,27 27,20" />
    </g>

    <!-- Star Geometric Rosette -->
    <path d="M0,-30 L9,-9 L30,0 L9,9 L0,30 L-9,9 L-30,0 L-9,-9 Z" fill="url(#goldGrad)" opacity="0.9" />
    <path d="M-21,-21 L0,-13 L21,-21 L13,0 L21,21 L0,13 L-21,21 L-13,0 Z" fill="#FFFBEB" opacity="0.8" />

    <!-- Center Medallion -->
    <circle cx="0" cy="0" r="17" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
    
    <!-- Arabic Calligraphy "ش" (Sheen for Shamsiyya) with Three Dots -->
    <!-- Base curve of Sheen -->
    <path d="M-9,-2 C-8,4 8,4 9,-2 C9,7 -9,7 -9,-2 Z" fill="#FFFBEB" />
    <!-- Three Crown Dots of Sheen -->
    <circle cx="-5" cy="-8" r="1.8" fill="#FDE68A" />
    <circle cx="5" cy="-8" r="1.8" fill="#FDE68A" />
    <circle cx="0" cy="-12" r="2" fill="#FFFBEB" />
  </g>
</svg>
